name: Verify organization community defaults
on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/verify-community-defaults.yml'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/verify-community-defaults.yml'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
permissions:
  contents: read
jobs:
  validate:
    uses: 561-group/.github/.github/workflows/verify-community-defaults.yml@4d149b6bbc902a8f3d5403941dee36b586e17860
